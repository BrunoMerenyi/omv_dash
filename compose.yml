services:
  nas-dashboard:
    image: ghcr.io/brunomerenyi/omv_dash:latest
    pull_policy: always                         # update with: docker compose up -d
    container_name: nas-dashboard
    network_mode: host                          # real network stats and IP; serves port 6767
    pid: host                                   # process list (read-only)
    environment:
      JELLYFIN_API_KEY: ""                      # optional: Jellyfin → Dashboard → API Keys
      MC_HOST: ""                               # optional: Minecraft Java server, e.g. 127.0.0.1
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /srv:/srv:ro,rslave                     # pool and disk usage
      - /var/lib/nas-dashboard/smart:/smart:ro  # SMART data (optional, see README)
    restart: unless-stopped

  # Read-only window into Docker: only "list containers" and "container stats"
  # get through. The dashboard itself never touches the Docker socket.
  docker-proxy:
    image: wollomatic/socket-proxy:1
    container_name: docker-proxy
    network_mode: host                          # listens on 127.0.0.1:2375 only
    command: [-loglevel=WARN, '-allowGET=^/containers/(json|[0-9a-f]{64}/stats)$$']
    user: "65534:999"                           # ← 999: your docker group, see README
    environment: [GOMEMLIMIT=4MiB]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
