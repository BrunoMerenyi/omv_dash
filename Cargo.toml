[package]
name = "nas-dashboard"
version = "2.1.1"
edition = "2021"
description = "Small live dashboard for a Debian/OpenMediaVault NAS"

[dependencies]
libc = "0.2"        # statvfs (disk sizes), sysconf, signal handling
serde_json = "1"    # build and parse JSON
sha1_smol = "1"     # WebSocket handshake (tiny, no dependencies)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
